<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEM Mentalist - Analyzer Matrix</title>
  
  <!-- Manifeste PWA & thème pour l'icône Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 1s ease;
    }

    /* Matrix canvas background */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      opacity: 0.25;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90%;
      max-width: 600px;
      padding: 20px;
      text-align: center;
    }

    /* Start Button */
    #start-btn {
      background-color: transparent;
      color: #00ff66;
      border: 2px solid #00ff66;
      border-radius: 6px;
      padding: 16px 40px;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
      transition: all 0.2s ease-in-out;
      touch-action: manipulation;
    }

    #start-btn:active {
      transform: scale(0.95);
      background-color: rgba(0, 255, 102, 0.2);
    }

    /* Main Message Box */
    #message-box {
      display: none;
      width: 100%;
      padding: 25px 20px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff66;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      transition: transform 0.15s ease, background-color 0.2s ease;
      touch-action: manipulation;
    }

    #message-box:active {
      transform: scale(0.97);
      background: rgba(0, 255, 102, 0.15);
    }

    #main-text {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px #00ff66;
      line-height: 1.4;
      text-align: center;
    }

    #sub-text {
      font-size: 0.85rem;
      color: #00ff66;
      margin-top: 10px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    /* ERROR FULLSCREEN OVERLAY */
    #error-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(20, 0, 0, 0.95);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      opacity: 0;
      transition: opacity 2.5s ease;
    }

    #error-overlay.active {
      display: flex;
      opacity: 1;
    }

    .error-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      width: 120%;
      height: 120%;
      color: #ff0033;
      font-family: monospace;
      font-weight: 900;
      font-size: 1.4rem;
      line-height: 1.6;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033;
      animation: errorGlitch 0.15s infinite alternate;
      word-break: break-all;
      pointer-events: none;
    }

    @keyframes errorGlitch {
      0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); }
      50% { transform: translate(-3px, 2px) scale(1.01); filter: hue-rotate(15deg); }
      100% { transform: translate(3px, -2px) scale(0.99); filter: hue-rotate(-15deg); }
    }

    /* FINAL REVEAL OVERLAY */
    #reveal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d1117;
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 3.5s cubic-bezier(0.25, 1, 0.5, 1);
      padding: 20px;
    }

    #reveal-overlay.active {
      display: flex;
      opacity: 1;
    }

    #reveal-card-title {
      font-size: clamp(2.4rem, 7.5vw, 4.5rem);
      font-weight: 900;
      color: #00ff66;
      text-shadow: 0 0 20px rgba(0, 255, 102, 0.8), 0 0 40px rgba(0, 255, 102, 0.4);
      letter-spacing: 3px;
      text-align: center;
      line-height: 1.4;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 3.5s ease 0.5s, transform 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #reveal-card-title span {
      display: block;
      text-align: center;
      width: 100%;
    }

    #reveal-overlay.active #reveal-card-title {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <div class="container">
    <button id="start-btn">Analyzer</button>

    <div id="message-box">
      <div id="main-text">...</div>
      <div id="sub-text"></div>
    </div>
  </div>

  <!-- Ecran ERROR -->
  <div id="error-overlay">
    <div class="error-grid" id="error-grid"></div>
  </div>

  <!-- Ecran de Révélation finale -->
  <div id="reveal-overlay">
    <div id="reveal-card-title">
      <span>Sauf</span>
      <span>Le Valet</span>
      <span>De Trèfle</span>
    </div>
  </div>

  <script>
    // --- WEB AUDIO API ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let errorAlarmInterval = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBipBipSound() {
      initAudio();
      const now = audioCtx.currentTime;
      
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1400, now);
      gain1.gain.setValueAtTime(0.08, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.05);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1800, now + 0.07);
      gain2.gain.setValueAtTime(0.08, now + 0.07);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.07);
      osc2.stop(now + 0.12);
    }

    function playBeepSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(900, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.04);
    }

    function startErrorAlarm() {
      initAudio();
      
      function pulseAlarm() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const freqs = [900, 450, 900, 450];
        
        freqs.forEach((freq, index) => {
          const startTime = now + (index * 0.07);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.1, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.06);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.06);
        });
      }

      pulseAlarm();
      errorAlarmInterval = setInterval(pulseAlarm, 380);
    }

    function stopErrorAlarm() {
      if (errorAlarmInterval) {
        clearInterval(errorAlarmInterval);
        errorAlarmInterval = null;
      }
    }

    function playRevealSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 3.0);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.06, now + 1.5);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 3.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 3.5);
    }

    // --- ANIMATION MATRIX ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let matrixColor = '#00ff66';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEF♠♥♦♣';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(13, 17, 23, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = matrixColor;
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    // --- LOGIQUE DE L'APPLICATION ---
    let currentStep = 0;
    let countdownInterval = null;

    const startBtn = document.getElementById('start-btn');
    const messageBox = document.getElementById('message-box');
    const mainText = document.getElementById('main-text');
    const subText = document.getElementById('sub-text');
    const errorOverlay = document.getElementById('error-overlay');
    const errorGrid = document.getElementById('error-grid');
    const revealOverlay = document.getElementById('reveal-overlay');

    startBtn.addEventListener('click', () => {
      playBipBipSound();
      startBtn.style.display = 'none';
      messageBox.style.display = 'block';
      startCountdown();
    });

    function startCountdown() {
      currentStep = 1;
      let timeLeft = 15;

      mainText.textContent = `Analyzing... ${timeLeft}s`;
      subText.textContent = "Veuillez patienter";

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          mainText.textContent = `Analyzing... ${timeLeft}s`;
          playBeepSound();
        } else {
          clearInterval(countdownInterval);
          showStep1();
        }
      }, 1000);
    }

    function showStep1() {
      currentStep = 2;
      mainText.textContent = "Il y a 20 cartes face en l'air";
      subText.textContent = "";
    }

    function showStep2() {
      currentStep = 3;
      mainText.textContent = "Il y a 10 cartes rouges";
      subText.textContent = "";
    }

    function showStep3() {
      currentStep = 4;
      mainText.textContent = "Les cartes noires sont des cartes à points";
      subText.textContent = "";
    }

    function showStep4() {
      currentStep = 5;
      startErrorAlarm();
      matrixColor = '#ff0033';
      
      errorGrid.innerHTML = 'ERROR '.repeat(450);
      errorOverlay.classList.add('active');
    }

    function showStep5() {
      currentStep = 6;
      stopErrorAlarm();
      playBipBipSound();
      playRevealSound();

      errorOverlay.style.opacity = '0';
      
      setTimeout(() => {
        errorOverlay.classList.remove('active');
        revealOverlay.classList.add('active');
        matrixColor = '#00ff66';
      }, 1000);
    }

    messageBox.addEventListener('click', () => {
      playBipBipSound();

      if (currentStep === 1) {
        clearInterval(countdownInterval);
        showStep1();
      } else if (currentStep === 2) {
        showStep2();
      } else if (currentStep === 3) {
        showStep3();
      } else if (currentStep === 4) {
        showStep4();
      }
    });

    errorOverlay.addEventListener('click', () => {
      if (currentStep === 5) {
        showStep5();
      }
    });

    revealOverlay.addEventListener('click', () => {
      if (currentStep === 6) {
        playBipBipSound();
        location.reload();
      }
    });
  </script>
</body>
</html>
